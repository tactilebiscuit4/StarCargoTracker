[package]
name = "star-cargo-tracker"
version = "0.1.2"
edition = "2021"
description = "Tracks Star Citizen commodity trades by reading Game.log"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ctrlc = "3.5.2"
eframe = "0.36.2"
regex = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_xlsxwriter = { version = "0.99.1", features = ["chrono"] }
rustyline = "18.0.1"
serde_json = "1.0.154"
ureq = "3.4.2"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell"] }
