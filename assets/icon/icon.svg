<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <title>Star Cargo Tracker</title>
  <!-- Drawn on a 32x32 pixel grid, in the banner's colours. -->
  <rect width="32" height="32" rx="6" fill="#0d1117"/>
  <!-- Distant stars, as in the banner. -->
  <g fill="#8c8c8c">
    <rect x="5" y="5" width="1" height="1"/>
    <rect x="11" y="3" width="1" height="1"/>
    <rect x="15" y="7" width="1" height="1"/>
    <rect x="28" y="12" width="1" height="1"/>
  </g>
  <!-- The bright star. -->
  <g fill="#e6edf3">
    <rect x="23" y="1" width="1" height="9"/>
    <rect x="19" y="5" width="9" height="1"/>
    <rect x="22" y="4" width="3" height="3"/>
  </g>
  <!-- The cargo crate: lid, sides, base and ribs. -->
  <g fill="#5ac8dc">
    <rect x="5" y="12" width="22" height="3"/>
    <rect x="5" y="15" width="2" height="12"/>
    <rect x="25" y="15" width="2" height="12"/>
    <rect x="5" y="26" width="22" height="2"/>
    <rect x="10" y="17" width="2" height="7"/>
    <rect x="15" y="17" width="2" height="7"/>
    <rect x="20" y="17" width="2" height="7"/>
  </g>
</svg>
